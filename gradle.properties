# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.daemon=true

# Local proxy (Clash) - direct connections to Fabric Maven are throttled here
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
systemProp.http.nonProxyHosts=localhost|127.0.0.1

# Network resilience
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=1000

# Minecraft / Fabric
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.20.1

# Mod
mod_version=0.3.0-alpha.1
maven_group=io.github.xiaod
archives_base_name=big-fat-fish-can-play-mc
